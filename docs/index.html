<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>墨迹 · 个人博客</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Sans SC', sans-serif; background: #E6E3D6; color: #262624; }
    .font-serif-display { font-family: 'Noto Serif SC', 'Playfair Display', serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .noise-overlay::before {
      content: ''; position: absolute; inset: 0; z-index: 1; opacity: 0.5;
      mix-blend-mode: overlay; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
    .scroll-fade { opacity: 0; transform: translateY(30px); transition: opacity 0.8s ease, transform 0.8s ease; }
    .scroll-fade.visible { opacity: 1; transform: translateY(0); }
    .article-card { transition: all 0.3s ease; cursor: pointer; }
    .article-card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
    .article-card:hover .article-img { transform: scale(1.05); }
    .article-img { transition: transform 0.5s ease; }
    .tag-btn { transition: all 0.15s ease; }
    .tag-btn:hover, .tag-btn.active { background: #1A4D2E; color: #fff; border-color: #1A4D2E; }
    .nav-link { position: relative; transition: color 0.15s ease; }
    .nav-link::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 0; height: 1.5px; background: #1A4D2E; transition: width 0.3s ease; }
    .nav-link:hover::after { width: 100%; }
    .nav-link:hover { color: #1A4D2E; }
    .glow-1 { position: absolute; width: 800px; height: 800px; background: rgba(26,77,46,0.1); filter: blur(120px); border-radius: 50%; pointer-events: none; }
    .glow-2 { position: absolute; width: 500px; height: 500px; background: rgba(204,85,0,0.06); filter: blur(100px); border-radius: 50%; pointer-events: none; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .float-anim { animation: float 6s ease-in-out infinite; }
    @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .pulse-dot { animation: pulse-dot 2s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .cursor-blink { animation: blink 1s step-end infinite; }
    .toast { animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateY(20px); } }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(26,77,46,0.3); border-radius: 3px; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .fade-enter-active, .fade-leave-active { transition: opacity 0.3s ease; }
    .fade-enter-from, .fade-leave-to { opacity: 0; }
    .md-content h1 { font-family: 'Noto Serif SC', serif; font-size: 1.875rem; font-weight: 600; margin: 1.5em 0 0.5em; line-height: 1.3; }
    .md-content h2 { font-family: 'Noto Serif SC', serif; font-size: 1.5rem; font-weight: 600; margin: 1.3em 0 0.4em; line-height: 1.35; border-bottom: 1px solid rgba(38,38,36,0.1); padding-bottom: 0.3em; }
    .md-content h3 { font-family: 'Noto Serif SC', serif; font-size: 1.25rem; font-weight: 600; margin: 1.2em 0 0.3em; }
    .md-content p { margin: 0.8em 0; line-height: 1.85; color: #5A5852; }
    .md-content a { color: #1A4D2E; text-decoration: underline; text-underline-offset: 2px; }
    .md-content a:hover { color: #CC5500; }
    .md-content strong { color: #262624; font-weight: 600; }
    .md-content ul, .md-content ol { margin: 0.8em 0; padding-left: 1.5em; color: #5A5852; }
    .md-content li { margin: 0.3em 0; line-height: 1.75; }
    .md-content li::marker { color: #1A4D2E; }
    .md-content blockquote { border-left: 3px solid #1A4D2E; padding: 0.5em 1em; margin: 1em 0; background: rgba(26,77,46,0.04); border-radius: 0 4px 4px 0; color: #5A5852; }
    .md-content blockquote p { margin: 0.3em 0; }
    .md-content code { font-family: 'JetBrains Mono', monospace; font-size: 0.875em; background: rgba(26,77,46,0.08); padding: 0.15em 0.4em; border-radius: 3px; color: #CC5500; }
    .md-content pre { background: #1A4D2E; color: #d4d4d4; padding: 1em 1.25em; border-radius: 4px; margin: 1em 0; overflow-x: auto; font-size: 0.85rem; line-height: 1.65; }
    .md-content pre code { background: none; padding: 0; color: inherit; font-size: inherit; }
    .md-content hr { border: none; border-top: 1px solid rgba(38,38,36,0.15); margin: 2em 0; }
    .md-content img { max-width: 100%; border-radius: 4px; margin: 1em 0; }
    .md-content table { width: 100%; border-collapse: collapse; margin: 1em 0; font-size: 0.9em; }
    .md-content th, .md-content td { border: 1px solid rgba(38,38,36,0.15); padding: 0.5em 0.75em; text-align: left; }
    .md-content th { background: rgba(26,77,46,0.06); font-weight: 600; }
    .featured-card { transition: all 0.4s ease; }
    .featured-card:hover { transform: translateY(-6px); }
    .featured-card:hover .featured-img { transform: scale(1.03); }
    .featured-img { transition: transform 0.6s ease; }
  </style>
</head>
<body>
<div id="app">

  <!-- Navigation -->
  <nav class="fixed top-0 left-0 right-0 z-50 backdrop-blur-sm bg-[#E6E3D6]/90 border-b border-[rgba(38,38,36,0.1)]">
    <div class="max-w-7xl mx-auto px-6 md:px-12 flex items-center justify-between h-16 md:h-[72px]">
      <a href="#" @click.prevent="goHome" class="flex items-center gap-3 group">
        <div class="w-9 h-9 bg-[#1A4D2E] rounded-sm flex items-center justify-center group-hover:scale-105 transition-transform duration-300">
          <span class="text-white font-serif-display text-lg font-bold">墨</span>
        </div>
        <span class="font-serif-display text-xl tracking-tight">墨迹博客</span>
      </a>
      <div class="hidden md:flex items-center gap-8">
        <a v-for="link in navLinks" :key="link.id" @click.prevent="goSection(link.id)" class="nav-link text-sm font-medium text-[#5A5852] cursor-pointer">{{ link.label }}</a>
        <a href="https://github.com" target="_blank" class="w-9 h-9 flex items-center justify-center text-[#5A5852] hover:text-[#1A4D2E] transition-colors duration-150">
          <iconify-icon icon="lucide:github" width="18"></iconify-icon>
        </a>
      </div>
      <button @click="mobileMenuOpen = !mobileMenuOpen" class="md:hidden p-2 text-[#262624]">
        <iconify-icon :icon="mobileMenuOpen ? 'lucide:x' : 'lucide:menu'" width="24"></iconify-icon>
      </button>
    </div>
    <transition name="fade">
      <div v-if="mobileMenuOpen" class="md:hidden bg-[#F5F4F0] border-t border-[rgba(38,38,36,0.1)] px-6 py-4 space-y-1">
        <a v-for="link in navLinks" :key="link.id" @click.prevent="mobileMenuOpen = false; goSection(link.id)" class="block py-3 text-[#5A5852] text-sm font-medium cursor-pointer">{{ link.label }}</a>
      </div>
    </transition>
  </nav>

  <!-- ===================== HOME ===================== -->
  <template v-if="view === 'home'">

    <!-- Hero -->
    <section class="relative min-h-[90vh] pt-32 pb-20 px-6 md:px-12 overflow-hidden noise-overlay">
      <div class="glow-1 -top-40 -left-40"></div>
      <div class="glow-2 top-20 right-0"></div>
      <div class="relative z-10 max-w-7xl mx-auto grid lg:grid-cols-2 gap-16 items-center">
        <div class="scroll-fade">
          <div class="flex items-center gap-3 mb-8">
            <span class="w-2 h-2 bg-[#CC5500] rounded-full pulse-dot"></span>
            <span class="text-xs font-semibold tracking-[0.2em] uppercase text-[#CC5500]">正在写作中</span>
          </div>
          <h1 class="font-serif-display text-5xl md:text-7xl lg:text-8xl font-medium leading-[1.05] tracking-tight mb-8">
            用文字<br><span class="text-[#1A4D2E]">记录</span>思考
          </h1>
          <p class="text-lg md:text-xl text-[#5A5852] leading-relaxed max-w-lg mb-10">
            以 Markdown 为笔，以代码为墨。技术、设计与生活的深度思考。
          </p>
          <div class="flex flex-wrap items-center gap-4">
            <a @click.prevent="goSection('articles')" class="inline-flex items-center gap-2 bg-[#1A4D2E] text-white font-medium px-8 py-4 rounded-sm hover:bg-[#143d24] transition-all duration-150 cursor-pointer" style="box-shadow: 0 0 20px rgba(26,77,46,0.15);">
              开始阅读 <iconify-icon icon="lucide:arrow-right" width="16"></iconify-icon>
            </a>
          </div>
          <div class="flex items-center gap-8 mt-12 pt-8 border-t border-[rgba(38,38,36,0.1)]">
            <div><div class="font-serif-display text-3xl font-semibold text-[#1A4D2E]">{{ articles.length }}</div><div class="text-sm text-[#888888] mt-1">篇文章</div></div>
            <div><div class="font-serif-display text-3xl font-semibold text-[#1A4D2E]">posts/</div><div class="text-sm text-[#888888] mt-1">Markdown 驱动</div></div>
            <div><div class="font-serif-display text-3xl font-semibold text-[#1A4D2E]">0</div><div class="text-sm text-[#888888] mt-1">数据库依赖</div></div>
          </div>
        </div>
        <div class="scroll-fade relative hidden lg:block">
          <div class="relative aspect-[4/5] max-w-md mx-auto">
            <div class="absolute inset-0 bg-[#1A4D2E] rounded-sm transform rotate-2 scale-[0.97] blur-xl translate-x-3 translate-y-3 opacity-20"></div>
            <img src="https://picsum.photos/seed/dev-workspace-2025/600/750.jpg" alt="写作" class="relative w-full h-full object-cover rounded-sm border border-[rgba(38,38,36,0.1)]">
            <div class="absolute -bottom-6 -left-6 max-w-[280px] bg-[#1A4D2E] p-5 rounded-sm shadow-xl float-anim border border-[#1A4D2E]">
              <div class="flex items-center gap-1.5 mb-3">
                <span class="w-2.5 h-2.5 rounded-full bg-[#ff5f57]"></span>
                <span class="w-2.5 h-2.5 rounded-full bg-[#febc2e]"></span>
                <span class="w-2.5 h-2.5 rounded-full bg-[#28c840]"></span>
                <span class="ml-2 text-[10px] text-[#9EA08F] font-mono">posts/</span>
              </div>
              <div class="font-mono text-xs text-[#9EA08F] leading-relaxed">
                <span class="text-[#5A9E6F]">-rw-r--r--</span> vue3-guide.md<br>
                <span class="text-[#5A9E6F]">-rw-r--r--</span> minimal-design.md<br>
                <span class="text-[#5A9E6F]">-rw-r--r--</span> remote-work.md<br>
                <span class="text-white cursor-blink">▌</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Featured -->
    <section v-if="articles.length > 0" class="py-24 px-6 md:px-12">
      <div class="max-w-7xl mx-auto">
        <div class="scroll-fade featured-card overflow-hidden rounded-sm border border-[rgba(38,38,36,0.1)] bg-[#F5F4F0]">
          <div class="grid md:grid-cols-2">
            <div class="relative h-64 md:h-auto overflow-hidden">
              <img v-if="articles[0].image" :src="articles[0].image" class="featured-img w-full h-full object-cover">
              <div v-else class="w-full h-full min-h-[300px] bg-[#1A4D2E] flex items-center justify-center">
                <iconify-icon icon="lucide:hash" class="text-white/10" width="80"></iconify-icon>
              </div>
            </div>
            <div class="p-8 md:p-12 lg:p-16 flex flex-col justify-center">
              <div class="flex items-center gap-3 mb-6">
                <span class="px-3 py-1 text-xs font-semibold tracking-[0.15em] uppercase border border-[#CC5500]/30 text-[#CC5500] rounded-sm">{{ articles[0].tag }}</span>
                <span class="text-sm text-[#888888]">{{ articles[0].date }}</span>
              </div>
              <h2 class="font-serif-display text-3xl md:text-4xl font-medium tracking-tight mb-4 leading-[1.15]">{{ articles[0].title }}</h2>
              <p class="text-[#5A5852] leading-relaxed mb-8">{{ articles[0].excerpt }}</p>
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-full bg-[#1A4D2E] flex items-center justify-center text-white font-serif-display font-bold text-sm">{{ (articles[0].author || '墨')[0] }}</div>
                  <div>
                    <div class="text-sm font-medium">{{ articles[0].author || '郭万锋' }}</div>
                    <div class="text-xs text-[#888888]">{{ articles[0].readTime || 5 }} 分钟阅读</div>
                  </div>
                </div>
                <button @click="readArticle(articles[0])" class="inline-flex items-center gap-2 text-[#CC5500] font-medium text-sm hover:text-[#1A4D2E] transition-colors duration-150">
                  阅读全文 <iconify-icon icon="lucide:arrow-right" width="14"></iconify-icon>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Articles -->
    <section id="articles" class="py-24 px-6 md:px-12">
      <div class="max-w-7xl mx-auto">
        <div class="scroll-fade text-center mb-16">
          <span class="text-xs font-semibold tracking-[0.2em] uppercase text-[#CC5500] mb-4 block">文章</span>
          <h2 class="font-serif-display text-4xl md:text-5xl font-medium tracking-tight mb-4">最新文章</h2>
          <p class="text-lg text-[#5A5852] max-w-xl mx-auto">Markdown 驱动，代码与文字的交响</p>
        </div>
        <div class="scroll-fade flex flex-wrap justify-center gap-3 mb-12">
          <button v-for="tag in allTags" :key="tag" @click="activeTag = tag"
                  :class="activeTag === tag ? 'active' : ''"
                  class="tag-btn px-5 py-2 text-sm font-medium rounded-sm border border-[rgba(38,38,36,0.2)] text-[#5A5852]">{{ tag }}</button>
        </div>
        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
          <div v-for="(article, index) in filteredArticles" :key="article.slug"
               class="scroll-fade article-card bg-[#F5F4F0] rounded-sm border border-[rgba(38,38,36,0.1)] overflow-hidden"
               :style="{ transitionDelay: (index % 3) * 100 + 'ms' }"
               @click="readArticle(article)">
            <div class="relative h-52 overflow-hidden">
              <img v-if="article.image" :src="article.image" :alt="article.title" class="article-img w-full h-full object-cover">
              <div v-else class="w-full h-full bg-[#1A4D2E]/5 flex items-center justify-center">
                <iconify-icon icon="lucide:file-text" class="text-[#1A4D2E]/15" width="40"></iconify-icon>
              </div>
              <div class="absolute top-4 left-4">
                <span class="px-3 py-1 text-xs font-semibold tracking-[0.1em] uppercase bg-white/90 backdrop-blur-sm text-[#1A4D2E] rounded-sm">{{ article.tag }}</span>
              </div>
              <div class="absolute top-4 right-4">
                <span class="px-2 py-0.5 text-[10px] font-mono font-medium bg-[#262624]/80 text-[#9EA08F] rounded-sm backdrop-blur-sm">.md</span>
              </div>
            </div>
            <div class="p-8">
              <div class="flex items-center gap-2 text-xs text-[#888888] mb-3">
                <iconify-icon icon="lucide:calendar" width="12"></iconify-icon>
                <span>{{ article.date }}</span>
                <span class="mx-1">·</span>
                <iconify-icon icon="lucide:clock" width="12"></iconify-icon>
                <span>{{ article.readTime || 5 }} min</span>
              </div>
              <h3 class="font-serif-display text-xl font-medium tracking-tight mb-3 line-clamp-2">{{ article.title }}</h3>
              <p class="text-sm text-[#5A5852] leading-relaxed line-clamp-3 mb-6">{{ article.excerpt }}</p>
              <div class="flex items-center gap-2 text-sm font-medium text-[#CC5500]">
                阅读更多 <iconify-icon icon="lucide:arrow-up-right" width="14"></iconify-icon>
              </div>
            </div>
          </div>
        </div>
        <div v-if="filteredArticles.length === 0" class="text-center py-20">
          <iconify-icon icon="lucide:folder-open" width="48" class="text-[#888888] mb-4"></iconify-icon>
          <p class="text-[#888888] mb-2">暂无此分类的文章</p>
        </div>
      </div>
    </section>

    <!-- Quote -->
    <section class="py-24 px-6 md:px-12 relative overflow-hidden">
      <div class="absolute inset-0 bg-[#1A4D2E] noise-overlay"></div>
      <div class="glow-2 top-0 right-0"></div>
      <div class="relative z-10 max-w-4xl mx-auto text-center scroll-fade">
        <iconify-icon icon="lucide:quote" class="text-[#CC5500] mb-6" width="40"></iconify-icon>
        <blockquote class="font-serif-display text-3xl md:text-4xl lg:text-5xl font-medium text-white leading-[1.2] tracking-tight mb-8">代码是写给人看的，附带能在机器上运行</blockquote>
        <p class="text-[#9EA08F] text-lg">— Harold Abelson</p>
      </div>
    </section>

    <!-- About -->
    <section id="about" class="py-24 px-6 md:px-12">
      <div class="max-w-7xl mx-auto">
        <div class="grid lg:grid-cols-2 gap-16 items-center">
          <div class="scroll-fade relative">
            <div class="relative max-w-md mx-auto">
              <div class="absolute inset-0 bg-[#1A4D2E] rounded-sm transform -rotate-2 scale-[0.97] blur-xl -translate-x-2 translate-y-2 opacity-15"></div>
              <img src="https://picsum.photos/seed/about-dev-2025/500/600.jpg" alt="关于我" class="relative w-full aspect-[5/6] object-cover rounded-sm border border-[rgba(38,38,36,0.1)]">
              <div class="absolute -right-4 top-8 bg-white p-4 rounded-sm shadow-xl">
                <div class="text-xs font-semibold tracking-[0.15em] uppercase text-[#1A4D2E] mb-2">Tech Stack</div>
                <div class="flex flex-wrap gap-1.5 max-w-[140px]">
                  <span v-for="s in ['Java','DB','Linux','Docker','Nginx','Vue','AI']" :key="s" class="px-2 py-0.5 text-[10px] font-mono font-medium bg-[#F5F4F0] border border-[rgba(38,38,36,0.1)] rounded-sm text-[#5A5852]">{{ s }}</span>
                </div>
              </div>
            </div>
          </div>
          <div class="scroll-fade">
            <span class="text-xs font-semibold tracking-[0.2em] uppercase text-[#CC5500] mb-4 block">关于我</span>
            <h2 class="font-serif-display text-4xl md:text-5xl font-medium tracking-tight mb-6">热爱创造的<br>全栈开发者</h2>
            <div class="space-y-4 text-[#5A5852] leading-relaxed mb-8">
              <p>你好，我是郭万锋，一名全栈开发者。这个博客由 Markdown 驱动——文章存放在 <code class="font-mono text-sm bg-[#1A4D2E]/10 text-[#CC5500] px-1.5 py-0.5 rounded">posts/</code> 目录，零数据库，纯文件管理。</p>
              <p>相信优秀的产品源于技术与美学的融合。工作之余，热衷探索新技术和写作。</p>
              <p><a href="https://blog.csdn.net/weixin_48611928" target="_blank">我的CSDN</a></p>
            </div>
            <div class="grid grid-cols-2 gap-4 mb-8">
              <div v-for="info in [{l:'location',v:'深圳'},{l:'experience',v:'9 年+'},{l:'focus',v:'Java 全栈'},{l:'status',v:'open to work'}]" :key="info.l" class="p-4 bg-[#F5F4F0] rounded-sm border border-[rgba(38,38,36,0.05)]">
                <div class="text-xs text-[#888888] mb-1 font-mono">{{ info.l }}</div>
                <div class="text-sm font-medium">{{ info.v }}</div>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <a v-for="s in [{i:'lucide:github',u:'#'},{i:'lucide:twitter',u:'#'},{i:'lucide:mail',u:'#contact'}]" :key="s.i" :href="s.u" class="w-10 h-10 border border-[rgba(38,38,36,0.2)] rounded-sm flex items-center justify-center text-[#5A5852] hover:border-[#1A4D2E] hover:text-[#1A4D2E] transition-all duration-150">
                <iconify-icon :icon="s.i" width="18"></iconify-icon>
              </a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Contact -->
    <section id="contact" class="py-24 px-6 md:px-12">
      <div class="max-w-3xl mx-auto">
        <div class="scroll-fade bg-[#1A4D2E] noise-overlay rounded-sm p-8 md:p-12 lg:p-16 relative overflow-hidden">
          <div class="glow-2 -top-20 -right-20"></div>
          <div class="relative z-10 text-center">

              <div class="text-sm font-medium">{{ currentArticle.author || '郭万锋' }}</div>

        </div>
        <article class="scroll-fade md-content" v-html="currentArticle.html"></article>
        <div class="mt-16 pt-8 border-t border-[rgba(38,38,36,0.1)] flex items-center justify-between">
          <button @click="backToList" class="inline-flex items-center gap-2 text-sm text-[#5A5852] hover:text-[#1A4D2E] transition-colors duration-150">

  <!-- Back to Top -->

<script id="blog-data" type="application/json">[{"slug":"minimal-design","title":"极简设计的哲学：少即是多的艺术","tag":"设计","date":"2025 年 1 月 5 日","readTime":8,"author":"郭万锋","image":"https://picsum.photos/seed/minimal-phi/800/400.jpg","excerpt":"极简 ≠ 简陋\r\n极简设计的精髓不在于减少元素的数量，而在于提升每个元素的必要性。\r\n 每一行代码、每一个像素、每一处留白都应当有它存在的理由。\r\n Dieter Rams 的十条原则\r\n1. 好设计是创新的\r\n2. 好设计使产品有用\r\n3. 好设计是美观的\r","rawBody":"\r\n## 极简 ≠ 简陋\r\n极简设计的精髓不在于减少元素的数量，而在于**提升每个元素的必要性**。\r\n> 每一行代码、每一个像素、每一处留白都应当有它存在的理由。\r\n## Dieter Rams 的十条原则\r\n1. 好设计是创新的\r\n2. 好设计使产品有用\r\n3. 好设计是美观的\r\n4. 好设计使产品易被理解\r\n5. 好设计是谦逊的\r\n6. 好设计是诚实的\r\n7. 好设计是持久的\r\n8. 好设计是彻底的\r\n9. 好设计是环保的\r\n10. 好设计是尽可能少的设计\r\n## Web 中的极简\r\n- **清晰的视觉层次** — 用户第一眼看到最重要的信息\r\n- **克制的色彩** — 不超过 3 个主色\r\n- **有意义的留白** — 留白不是空白，是呼吸\r\n- **零思考的交互** — 路径要短，反馈要快"},{"slug":"hello-world","title":"你好，世界","tag":"思考","date":"2025 年 1 月 20 日","readTime":3,"author":"郭万锋","image":"./images/helloworld.jpg","excerpt":"欢迎来到墨迹博客\r\n这是第一篇文章。这个博客由 Markdown 驱动，文章存放在 posts/ 目录。\r\n 如何添加新文章？\r\n1. 在 posts/ 目录创建 .md 文件\r\n2. 文件顶部添加 frontmatter 元数据\r\n3. 下方用 Markdo","rawBody":"\r\n## 欢迎来到墨迹博客\r\n这是第一篇文章。这个博客由 **Markdown** 驱动，文章存放在 `posts/` 目录。\r\n### 如何添加新文章？\r\n1. 在 `posts/` 目录创建 `.md` 文件\r\n2. 文件顶部添加 frontmatter 元数据\r\n3. 下方用 Markdown 写正文\r\n4. 刷新页面即可看到\r\n```markdown\r\n---\r\ntitle: 文章标题\r\ntag: 分类\r\ndate: 2025 年 1 月 20 日\r\n---\r\n正文内容...\r\n```\r\n> 就这么简单。"},{"slug":"test","title":"文章标题","tag":"前端","date":"2025 年 1 月 20 日","readTime":10,"author":"郭万锋","image":"https://picsum.photos/seed/my-article/800/400.jpg","excerpt":"正文从这里开始\r\n\r\n用 Markdown 写作，支持所有标准语法：\r\n 代码块、表格、引用...","rawBody":"\r\n\r\n## 正文从这里开始\r\n\r\n用 Markdown 写作，支持所有标准语法：\r\n- 代码块、表格、引用...\r\n"},{"slug":"vue3-composition-api","title":"Vue 3 Composition API 深度指南","tag":"前端","date":"2025 年 1 月 10 日","readTime":15,"author":"郭万锋","image":"https://picsum.photos/seed/vue3-comp-api/800/400.jpg","excerpt":"为什么需要 Composition API？\r\nOptions API 把逻辑按选项类型分散到 data、methods、computed 中，当组件变得复杂时，相关的逻辑被拆得七零八落。\r\nComposition API 的核心思想是：将相关逻辑组织在一起。","rawBody":"\r\n## 为什么需要 Composition API？\r\nOptions API 把逻辑按选项类型分散到 `data`、`methods`、`computed` 中，当组件变得复杂时，**相关的逻辑被拆得七零八落**。\r\nComposition API 的核心思想是：**将相关逻辑组织在一起**。\r\n## 核心概念\r\n### ref — 基本类型的响应式\r\n```js\r\nimport { ref } from 'vue'\r\nconst count = ref(0)\r\nconsole.log(count.value) // 0\r\ncount.value++\r\n```\r\n### reactive — 对象的响应式\r\n```js\r\nimport { reactive } from 'vue'\r\nconst state = reactive({\r\n  user: null,\r\n  loading: false\r\n})\r\n```\r\n### computed — 派生状态\r\n```js\r\nconst fullName = computed(() => `${first.value} ${last.value}`)\r\n```\r\n## Composable 函数\r\n将逻辑提取为可复用的函数：\r\n```js\r\n// useCounter.js\r\nexport function useCounter(initial = 0) {\r\n  const count = ref(initial)\r\n  const increment = () => count.value++\r\n  const decrement = () => count.value--\r\n  return { count, increment, decrement }\r\n}\r\n```\r\n> 按功能模块组织 composable：useAuth、useCart、useTheme……每个封装自己的状态和逻辑，对外暴露清晰接口。"}]</script>

<script>
const { createApp, ref, computed, onMounted, onUnmounted, nextTick } = Vue;
marked.setOptions({ breaks: true, gfm: true });

createApp({
  setup() {
    const mobileMenuOpen = ref(false);
    const view = ref('home');
    const currentArticle = ref(null);
    const activeTag = ref('全部');
    const showBackToTop = ref(false);
    const toast = ref({ show: false, message: '', icon: 'lucide:check' });

    const navLinks = [
      { id: 'articles', label: '文章' },
      { id: 'about', label: '关于' },
      { id: 'contact', label: '联系' },
    ];

    const articles = ref([]);

    const allTags = computed(() => {
      return ['全部', ...new Set(articles.value.map(a => a.tag).filter(Boolean))];
    });

    const filteredArticles = computed(() => {
      if (activeTag.value === '全部') return articles.value;
      return articles.value.filter(a => a.tag === activeTag.value);
    });

    const checkVisibility = () => {
      document.querySelectorAll('.scroll-fade').forEach(el => {
        if (el.getBoundingClientRect().top < window.innerHeight - 80) el.classList.add('visible');
      });
    };

    const handleScroll = () => {
      showBackToTop.value = window.scrollY > 500;
      checkVisibility();
    };

    const loadPosts = () => {
      try {
        const dataEl = document.getElementById('blog-data');
        if (dataEl) {
          const rawData = JSON.parse(dataEl.textContent);
          articles.value = rawData.map(item => ({
            ...item,
            html: marked.parse(item.rawBody || item.excerpt || '')
          }));
        }
      } catch (e) {
        console.warn('Failed to load blog data', e);
        articles.value = [];
      }
      nextTick(() => { requestAnimationFrame(checkVisibility); });
    };

    const readArticle = (article) => {
      currentArticle.value = article;
      view.value = 'article';
      window.scrollTo({ top: 0, behavior: 'smooth' });
      nextTick(() => { setTimeout(checkVisibility, 300); });
    };

    const backToList = () => {
      view.value = 'home';
      currentArticle.value = null;
      nextTick(() => {
        requestAnimationFrame(() => {
          const el = document.getElementById('articles');
          if (el) {
            const top = el.getBoundingClientRect().top + window.scrollY - 80;
            window.scrollTo({ top: top, behavior: 'smooth' });
          }
          setTimeout(checkVisibility, 400);
        });
      });
    };

    const goHome = () => {
      view.value = 'home';
      currentArticle.value = null;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      nextTick(() => { setTimeout(checkVisibility, 300); });
    };

    const goSection = (id) => {
      view.value = 'home';
      mobileMenuOpen.value = false;
      nextTick(() => {
        requestAnimationFrame(() => {
          const el = document.getElementById(id);
          if (el) {
            const top = el.getBoundingClientRect().top + window.scrollY - 80;
            window.scrollTo({ top: top, behavior: 'smooth' });
          }
          setTimeout(checkVisibility, 300);
        });
      });
    };

    const scrollToTop = () => { window.scrollTo({ top: 0, behavior: 'smooth' }); };

    onMounted(() => {
      loadPosts();
      window.addEventListener('scroll', handleScroll);
      nextTick(() => { requestAnimationFrame(checkVisibility); });
    });
    onUnmounted(() => { window.removeEventListener('scroll', handleScroll); });

    return {
      mobileMenuOpen, view, articles, currentArticle, activeTag, showBackToTop,
      navLinks, allTags, filteredArticles, toast,
      readArticle, backToList, goHome, goSection, scrollToTop,
    };
  }
}).mount('#app');
</script>
</body>
